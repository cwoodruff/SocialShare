name: build-test-deploy

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore SocialShare.sln

      - name: Build
        run: dotnet build SocialShare.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SocialShare.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./artifacts/test-results
          if-no-files-found: ignore

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish src/SocialShare.Web/SocialShare.Web.csproj --configuration Release --no-build --output ./artifacts/publish

      - name: Upload publish output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./artifacts/publish

  deploy:
    name: Deploy to Azure App Service
    needs: build-test

    # Skipped until Azure is set up. The secrets context is not available in a job level if,
    # so this gates on the one variable the deploy cannot run without. Set AZURE_WEBAPP_NAME
    # last, once the secrets are in place, and this job starts running. Until then it shows as
    # skipped rather than failing every push. See docs/azure-deployment.md.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.AZURE_WEBAPP_NAME != ''

    runs-on: ubuntu-latest
    environment: production

    # Required for the OpenID Connect handshake with Entra ID. No publish profile,
    # no stored credential. See docs/azure-deployment.md.
    permissions:
      id-token: write
      contents: read

    steps:
      # azure/login fails with "Not all values are present" when a secret is missing, which does
      # not say which one. Check first and name it.
      - name: Check the Azure credentials are present
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=""
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            eval "value=\$$name"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::AZURE_WEBAPP_NAME is set, so this job ran, but these repository secrets are missing or empty:$missing"
            echo "::error::Add them under Settings, Secrets and variables, Actions. See docs/azure-deployment.md."
            exit 1
          fi

          echo "All three Azure credentials are present."

      - name: Download publish output
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ./publish

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Check the health endpoint
        run: |
          url="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"
          for attempt in $(seq 1 20); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
            if [ "$status" = "200" ]; then
              echo "Healthy after $attempt attempt(s)."
              exit 0
            fi
            echo "Attempt $attempt returned $status, waiting."
            sleep 15
          done
          echo "The app never reported healthy."
          exit 1
